<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- App Title -->
  <title>StreamX - Netflix-Style Video Streaming</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="StreamX - Watch your favorite videos anytime, anywhere. Production-ready Flutter video streaming app.">
  <meta name="keywords" content="video streaming, flutter, streamx, movies, tv shows">
  <meta name="author" content="StreamX Team">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#141414">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://streamx.app/">
  <meta property="og:title" content="StreamX - Netflix-Style Video Streaming">
  <meta property="og:description" content="Watch your favorite videos anytime, anywhere. Built with Flutter.">
  <meta property="og:image" content="https://streamx.app/icons/og-image.png">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://streamx.app/">
  <meta property="twitter:title" content="StreamX - Netflix-Style Video Streaming">
  <meta property="twitter:description" content="Watch your favorite videos anytime, anywhere.">
  <meta property="twitter:image" content="https://streamx.app/icons/og-image.png">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://streamx.app/">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/Icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/Icon-16.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  
  <!-- Apple PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreamX">
  
  <!-- Microsoft -->
  <meta name="msapplication-TileColor" content="#141414">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <!-- Preload critical resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Splash Screen Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      background-color: #141414;
      font-family: 'Nunito', sans-serif;
    }
    
    /* Loading splash screen */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #141414;
      color: #ffffff;
    }
    
    #loading .logo {
      font-size: 3rem;
      font-weight: 800;
      color: #E50914;
      letter-spacing: 4px;
      margin-bottom: 32px;
      text-shadow: 0 0 30px rgba(229, 9, 20, 0.5);
    }
    
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(229, 9, 20, 0.3);
      border-top-color: #E50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #loading .tagline {
      margin-top: 20px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 2px;
    }
    
    /* Flutter app container */
    flt-glass-pane {
      height: 100vh !important;
    }
  </style>
  
  <!-- Firebase SDK (deferred for performance) -->
  <script defer src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
</head>
<body>
  <!-- Splash Screen (shown until Flutter loads) -->
  <div id="loading">
    <div class="logo">STREAMX</div>
    <div class="spinner"></div>
    <div class="tagline">LOADING YOUR EXPERIENCE</div>
  </div>

  <!-- Flutter JS Bootstrap -->
  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function() {
        navigator.serviceWorker.register('flutter_service_worker.js?v=1.0.0');
      });
    }
    
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.transition = 'opacity 0.5s ease';
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 500);
      }
    });
  </script>
  
  <!-- Flutter Engine Loader -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
