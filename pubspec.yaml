name: streamx
description: "StreamX - Production-Ready Netflix-Style Video Streaming App built with Flutter + GetX | Clean Architecture | MVVM | Firebase | Enterprise-Grade Portfolio Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  get: ^4.6.6

  # Network
  dio: ^5.4.1
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.2

  # Video Player
  video_player: ^2.8.3
  better_player: ^0.0.84
  chewie: ^1.7.4

  # Image Caching
  cached_network_image: ^3.3.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^2.27.1
  firebase_analytics: ^10.8.9
  firebase_crashlytics: ^3.4.18
  firebase_performance: ^0.9.3+18
  firebase_messaging: ^14.7.19
  firebase_remote_config: ^4.3.18

  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1

  # Utilities
  logger: ^2.2.0
  intl: ^0.19.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  url_launcher: ^6.2.6
  package_info_plus: ^5.0.1
  device_info_plus: ^10.1.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation (dev)
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1
  network_image_mock: ^2.1.1

  # Code Quality
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
