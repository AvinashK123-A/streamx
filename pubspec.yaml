name: streamx
description: "StreamX - Production-Ready Netflix-Style Video Streaming App"
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  get: ^4.6.6

  # Network
  dio: ^5.4.0
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1

  # Video Player
  video_player: ^2.8.3
  better_player: ^0.0.84
  chewie: ^1.7.4

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^2.27.1
  firebase_analytics: ^10.8.9
  firebase_crashlytics: ^3.4.18
  firebase_performance: ^0.9.3+18
  firebase_messaging: ^14.7.20
  firebase_remote_config: ^4.3.15

  # UI & Animations
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.2.1

  # Utilities
  logger: ^2.0.2+1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.19.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.0
  uuid: ^4.3.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
