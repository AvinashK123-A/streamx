name: Android Release Build

on:
  push:
    branches: [ main, 'release/**' ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Get Flutter version info
        run: flutter --version
      
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run code generation
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
      
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
      
      - name: Setup Firebase google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
      
      - name: Create environment file
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            cp .env.prod .env
          else
            cp .env.staging .env
          fi
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          PROD_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          PROD_FCM_SENDER_ID: ${{ secrets.PROD_FCM_SENDER_ID }}
          PROD_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          PROD_FIREBASE_APP_ID_ANDROID: ${{ secrets.PROD_FIREBASE_APP_ID_ANDROID }}
          PROD_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
          PROD_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
          PROD_FIREBASE_DATABASE_URL: ${{ secrets.PROD_FIREBASE_DATABASE_URL }}
          PROD_SSL_CERT_PIN: ${{ secrets.PROD_SSL_CERT_PIN }}
          PROD_SSL_CERT_PIN_BACKUP: ${{ secrets.PROD_SSL_CERT_PIN_BACKUP }}
      
      - name: Build APK (universal)
        run: |
          flutter build apk --release \
            --dart-define-from-file=.env \
            --obfuscate \
            --split-debug-info=build/debug-symbols
      
      - name: Build APK (split by ABI)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --dart-define-from-file=.env \
            --obfuscate \
            --split-debug-info=build/debug-symbols
      
      - name: Build App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=.env \
            --obfuscate \
            --split-debug-info=build/debug-symbols
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ github.sha }}
          path: |
            build/app/outputs/apk/release/*.apk
          retention-days: 30
      
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols-${{ github.sha }}
          path: build/debug-symbols/
          retention-days: 30
      
      - name: Upload to Firebase App Distribution (Staging)
        if: github.event.inputs.environment != 'production'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.STAGING_FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: build/app/outputs/apk/release/app-release.apk
          releaseNotes: "Build from commit ${{ github.sha }}"
      
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
